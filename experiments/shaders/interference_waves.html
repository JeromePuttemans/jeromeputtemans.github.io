<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Interference Waves</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: monospace; gap: 16px; cursor: none; }
    #c { display: block; width: min(90vw, 85vh); height: min(90vw, 85vh); }
    .controls { display: flex; gap: 24px; color: #555; font-size: 12px; align-items: center; flex-wrap: wrap; justify-content: center; cursor: default; }
    label { display: flex; align-items: center; gap: 8px; }
    input[type=range] { accent-color: #446; width: 100px; cursor: pointer; }
    span { color: #888; min-width: 32px; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div class="controls">
  <label>Fréquence <input type="range" id="rF" min="5"  max="40" value="18"> <span id="vF">18</span></label>
  <label>Vitesse   <input type="range" id="rS" min="1"  max="30" value="8">  <span id="vS">0.8</span></label>
  <label>Sources   <input type="range" id="rN" min="2"  max="8"  value="4">  <span id="vN">4</span></label>
  <label>Contraste <input type="range" id="rC" min="1"  max="20" value="8">  <span id="vC">0.8</span></label>
</div>

<script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl');
const SZ = 512;
canvas.width = SZ; canvas.height = SZ;
gl.viewport(0, 0, SZ, SZ);

let freq = 18.0, speed = 0.8, nSrc = 4, contrast = 0.8;
let mouseX = 0.0, mouseY = 0.0, targetX = 0.0, targetY = 0.0;

canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  targetX =  (e.clientX - r.left)  / r.width  * 2.0 - 1.0;
  targetY =   (e.clientY - r.top)  / r.height * 2.0 - 1.0;
});

function ctrl(id, outId, scale, cb) {
  document.getElementById(id).addEventListener('input', e => {
    const v = (e.target.value / scale).toFixed(scale === 1 ? 0 : 1);
    document.getElementById(outId).textContent = v;
    cb(parseFloat(v));
  });
}
ctrl('rF', 'vF', 1,  v => { freq = v; });
ctrl('rS', 'vS', 10, v => { speed = v; });
ctrl('rN', 'vN', 1,  v => { nSrc = v; buildProgram(); });
ctrl('rC', 'vC', 10, v => { contrast = v; });

const VERT = `attribute vec2 pos; void main(){gl_Position=vec4(pos,0.,1.);}`;

// Sources fixes disposées en cercle (+ souris = source bonus)
function makeFrag(n) {
  // Positions des sources fixes en coordonnées [-1..1]
  const srcs = [];
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2;
    const r = 0.55;
    srcs.push([Math.cos(a) * r, Math.sin(a) * r]);
  }

  const srcLines = srcs.map((s, i) =>
    `vec2 s${i} = vec2(${s[0].toFixed(4)}, ${s[1].toFixed(4)});`
  ).join('\n  ');

  const waveLines = srcs.map((_, i) =>
    `wave += sin(length(p - s${i} * asp) * u_freq - u_t);`
  ).join('\n  ');

  return `
precision highp float;
uniform float u_t, u_freq, u_contrast;
uniform vec2  u_res, u_mouse;

#define PI 3.14159265

void main(){
  vec2 uv = gl_FragCoord.xy / u_res;
  uv.y = 1.0 - uv.y;
  vec2 p  = uv * 2.0 - 1.0;
  vec2 asp = vec2(u_res.x / u_res.y, 1.0);

  // Sources fixes
  ${srcLines}

  float wave = 0.0;
  float totalSrc = float(${n}) + 1.0;

  // Accumule les ondes des sources fixes
  ${waveLines}

  // Source souris
  vec2 mouse = u_mouse * asp;
  wave += sin(length(p * asp - mouse) * u_freq - u_t) * 1.2;

  // Normalise et mappe vers luminosité
  wave /= totalSrc;

  // Crêtes nettes : cos² donne des anneaux fins sur fond sombre
  float bright = pow(max(0.0, cos(wave * PI)), u_contrast * 8.0);

  // Légère teinte bleu-blanc comme dans le shader précédent
  vec3 col = bright * vec3(0.82, 0.90, 1.00);

  // Points sources : petits disques blancs
  ${srcs.map((_, i) => `
  {
    vec2 sp = s${i} * asp;
    float d = length(p * asp - sp) - 0.012;
    col += vec3(1.0) * (1.0 - smoothstep(0.0, 0.004, d));
    col += vec3(0.5,0.65,1.0) * (0.04 / (d*d + 0.002));
  }`).join('')}

  // Point source souris
  {
    float d = length(p * asp - mouse) - 0.016;
    col += vec3(1.0) * (1.0 - smoothstep(0.0, 0.005, d));
    col += vec3(0.4,0.6,1.0) * (0.06 / (d*d + 0.002));
  }

  gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}`; }

function mkShader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
  return s;
}

let prog, uT, uF, uC, uR, uM;

function buildProgram() {
  if (prog) gl.deleteProgram(prog);
  prog = gl.createProgram();
  gl.attachShader(prog, mkShader(gl.VERTEX_SHADER, VERT));
  gl.attachShader(prog, mkShader(gl.FRAGMENT_SHADER, makeFrag(nSrc)));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const a = gl.getAttribLocation(prog, 'pos');
  gl.enableVertexAttribArray(a);
  gl.vertexAttribPointer(a, 2, gl.FLOAT, false, 0, 0);

  uT = gl.getUniformLocation(prog, 'u_t');
  uF = gl.getUniformLocation(prog, 'u_freq');
  uC = gl.getUniformLocation(prog, 'u_contrast');
  uR = gl.getUniformLocation(prog, 'u_res');
  uM = gl.getUniformLocation(prog, 'u_mouse');
  gl.uniform2f(uR, SZ, SZ);
}

buildProgram();

const INERTIA = 0.06;
function frame(ms) {
  mouseX += (targetX - mouseX) * INERTIA;
  mouseY += (targetY - mouseY) * INERTIA;

  gl.uniform1f(uT, ms * 0.001 * speed);
  gl.uniform1f(uF, freq);
  gl.uniform1f(uC, contrast);
  gl.uniform2f(uM, mouseX, mouseY);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
